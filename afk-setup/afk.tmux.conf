# afk: colour worker windows in the status line by their @afk_state (set by `afk watch`).
# Needs you: red. PR Ready: green. Waiting for a verify slot: grey. Every other window keeps your own style.
# Safe to source again: your style is captured only while it is not already this one.
if -F '#{m:*@afk_state*,#{window-status-style}}' '' 'set -gF @afk_base_style "#{window-status-style}"'
set -g window-status-style '#{?#{==:#{@afk_state},review},fg=green,#{?#{||:#{||:#{==:#{@afk_state},question},#{==:#{@afk_state},blocked}},#{||:#{==:#{@afk_state},attention},#{==:#{@afk_state},stuck}}},fg=red#,bold,#{?#{==:#{@afk_state},queued},fg=colour244,#{E:@afk_base_style}}}}'
